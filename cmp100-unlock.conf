# /etc/cmp100-unlock.conf  --  sourced by /usr/local/sbin/cmp100-unlock

# Space-separated PCI BDFs to unlock. Empty = auto-detect every 10de:1d84 / 10de:1df4.
# CMP100_BDFS="0000:01:00.0 0000:05:00.0"

# 1 = also retrain PCIe to Gen2 after the Tensor unlock. 0 = Tensor only.
CMP100_GEN2=1

# Extra services to stop before the driver handoff and restart afterwards.
# CMP100_STOP_SERVICES="ollama.service my-inference.service"

# How many unbind/retrain/rebind cycles to try for Gen2 per card.
CMP100_RETRAIN_ATTEMPTS=3
